[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-council"
version = "0.26.0"
description = "OLYMPUS — a controlled-autonomy, self-improving multi-agent AI assistant with a built-in hallucination controller"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "maadjiba24-afk" }]
keywords = [
    "ai", "agent", "assistant", "multi-agent", "llm", "anthropic", "claude",
    "controlled-autonomy", "byok", "self-improving", "hallucination-controller",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "anthropic>=0.92.0",
    "youtube-transcript-api>=1.0.0",
    "cryptography>=41.0.0",
]

# Optional backends. Each is imported LAZILY and guarded (the code degrades or
# skips cleanly when it is absent), so none is part of the required footprint —
# the three deps above are the whole required install. They are declared here so
# the dependency surface is fully truthful: nothing the code imports is
# undeclared. Install what you use, e.g. `pip install olympus-council[all]`.
[project.optional-dependencies]
postgres = ["psycopg>=3.1"]        # olympus/store.py + codegraph_introspect — Postgres
browser = ["websockets>=12.0"]     # olympus/browser.py — CDP-over-WebSocket transport
sandbox = ["pyyaml>=6.0"]          # olympus/sandbox.py — sandbox config parsing
mcp = ["mcp>=1.5.0"]               # olympus/mcp_client.py — native stdio/SSE MCP client
graphdb = ["neo4j>=5.0", "falkordb>=1.0"]  # codegraph_export — live graph-DB pushes
docs = ["pypdf>=4.0", "python-docx>=1.0"]  # olympus/webctx.py — PDF/DOCX parsing
# CI-only test tooling (NOT shipped runtime deps): the packages that let the
# opt-in integration tests actually run instead of self-skipping — `openai`
# drives the OpenAI-compatible server test, `websockets` the real-Chromium CDP
# transport, `mcp` the native MCP client integration, `pyyaml` the ABC drift
# guard. CI installs `.[test]` so this list is the single source of truth.
test = ["pytest", "openai", "websockets>=12.0", "mcp>=1.5.0", "pyyaml>=6.0"]
all = ["psycopg>=3.1", "websockets>=12.0", "pyyaml>=6.0", "mcp>=1.5.0",
       "neo4j>=5.0", "falkordb>=1.0", "pypdf>=4.0", "python-docx>=1.0"]

[project.urls]
Homepage = "https://github.com/maadjiba24-afk/Olympus-"
Repository = "https://github.com/maadjiba24-afk/Olympus-"
Issues = "https://github.com/maadjiba24-afk/Olympus-/issues"

[project.scripts]
olympus = "olympus.cli:main"

[tool.setuptools.packages.find]
include = ["olympus*"]

[tool.setuptools.package-data]
olympus = ["prompts/*.md", "*.json", "*.yaml", "witness_pubkey.txt"]
