[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-council"
version = "0.27.0"
description = "OLYMPUS — a controlled-autonomy, self-improving multi-agent AI assistant with a built-in hallucination controller"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "maadjiba24-afk" }]
keywords = [
    "ai", "agent", "assistant", "multi-agent", "llm", "anthropic", "claude",
    "controlled-autonomy", "byok", "self-improving", "hallucination-controller",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "anthropic>=0.92.0",
    "youtube-transcript-api>=1.0.0",
    "cryptography>=41.0.0",
    # Windows ships no IANA time-zone database, so `zoneinfo.ZoneInfo("UTC")`
    # raises there. `olympus/trading/instruments.py` builds its market sessions
    # at module scope, which made `import olympus.trading` fail outright on
    # Windows — found by the import-smoke CI leg, not by anyone's laptop.
    # Marker-scoped so it is not installed where the OS already provides one.
    'tzdata>=2024.1; sys_platform == "win32"',
]

# Optional backends. Each is imported LAZILY and guarded (the code degrades or
# skips cleanly when it is absent), so none is part of the required footprint —
# the three deps above are the whole required install. They are declared here so
# the dependency surface is fully truthful: nothing the code imports is
# undeclared. Install what you use, e.g. `pip install olympus-council[all]`.
[project.optional-dependencies]
postgres = ["psycopg>=3.1"]        # olympus/store.py + codegraph_introspect — Postgres
browser = ["websockets>=12.0"]     # olympus/browser.py — CDP-over-WebSocket transport
sandbox = ["pyyaml>=6.0"]          # olympus/sandbox.py — sandbox config parsing
# Upper bound added deliberately. `mcp` 2.0.0 (released 2026-07-28) removed
# `Server.list_tools()` and reworked the session API; `olympus/mcp_client.py`
# and the integration fixture both use the 1.x decorator API, so an unbounded
# `>=` silently pulled a breaking major into CI the morning after it shipped —
# every MCP integration test failed with "unhandled errors in a TaskGroup" and
# nothing in the repository had changed. This extra is not covered by
# requirements.lock, so the range here is the only bound there is.
# Moving to 2.x is a real port, not a version bump: see mcp_client.discover().
mcp = ["mcp>=1.5.0,<2"]            # olympus/mcp_client.py — native stdio/SSE MCP client
graphdb = ["neo4j>=5.0", "falkordb>=1.0"]  # codegraph_export — live graph-DB pushes
docs = ["pypdf>=4.0", "python-docx>=1.0"]  # olympus/webctx.py — PDF/DOCX parsing
bedrock = ["boto3>=1.34"]          # olympus/bedrock_converse.py — non-Claude Bedrock (Titan/Llama/Mistral) Converse API
# olympus/trading/kronos_runtime.py + kronos_adapter.py — the Kronos K-line
# forecasting backend. DELIBERATELY excluded from `all`: torch is a ~2GB
# install, and the entire trading core (contracts, validation, technical
# analysis, risk engine, OMS, paper broker, backtester) is pure stdlib and runs
# without it. Only the Kronos forecaster needs this; every other forecaster
# (persistence, drift, seasonal-naive) works on the base install, and the
# adapter raises errors.DependencyMissing rather than ImportError when absent.
kronos = ["torch>=2.0.0", "numpy>=1.24", "einops>=0.8.0",
          "huggingface_hub>=0.33.0", "safetensors>=0.6.0", "tqdm>=4.67"]
# olympus/trading/native/ — the Olympus-native forecasting model. Separate from
# `kronos` on purpose: installing Olympus's own model must not drag in a hub
# client, a tokeniser stack, or anything belonging to a third-party checkpoint.
# torch is imported lazily inside functions and its absence raises
# errors.DependencyMissing; the rest of native/ (state, windowing, checkpoint
# format, the statistical estimator) is pure stdlib and runs without it.
native = ["torch>=2.0.0"]
# CI-only test tooling (NOT shipped runtime deps): the packages that let the
# opt-in integration tests actually run instead of self-skipping — `openai`
# drives the OpenAI-compatible server test, `websockets` the real-Chromium CDP
# transport, `mcp` the native MCP client integration, `pyyaml` the ABC drift
# guard. CI installs `.[test]` so this list is the single source of truth.
test = ["pytest", "openai", "websockets>=12.0", "mcp>=1.5.0,<2", "pyyaml>=6.0"]
all = ["psycopg>=3.1", "websockets>=12.0", "pyyaml>=6.0", "mcp>=1.5.0,<2",
       "neo4j>=5.0", "falkordb>=1.0", "pypdf>=4.0", "python-docx>=1.0",
       "boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/maadjiba24-afk/Olympus-"
Repository = "https://github.com/maadjiba24-afk/Olympus-"
Issues = "https://github.com/maadjiba24-afk/Olympus-/issues"

[project.scripts]
olympus = "olympus.cli:main"

[tool.setuptools.packages.find]
include = ["olympus*"]

[tool.setuptools.package-data]
olympus = ["prompts/*.md", "*.json", "*.yaml", "witness_pubkey.txt"]
