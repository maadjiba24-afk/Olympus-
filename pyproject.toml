[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-council"
version = "0.15.0"
description = "OLYMPUS — self-improving multi-agent AI with a built-in hallucination controller"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.92.0",
    "youtube-transcript-api>=1.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
olympus = "olympus.cli:main"

[tool.setuptools.packages.find]
include = ["olympus*"]

[tool.setuptools.package-data]
olympus = ["prompts/*.md", "*.json"]
