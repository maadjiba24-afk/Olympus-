---
name: Content-addressed PyPI publisher
description: Run the audited PyPA publisher container by immutable digest

# This is the normalized inner Docker-action interface generated by
# pypa/gh-action-pypi-publish v1.14.2 at commit
# dc37677b2e1c63e2034f94d8a5b11f265b73ba33. The sole execution change is
# runs.image: the upstream SHA-named tag is replaced by its audited manifest
# digest. See UPSTREAM.md beside this file for provenance and update policy.
inputs:
  user:
    description: PyPI user
    required: false
    default: __token__
  password:
    description: Password for your PyPI user or an access token
    required: false
    default: ""
  repository-url:
    description: The repository URL to use
    required: false
    default: https://upload.pypi.org/legacy/
  packages-dir:
    description: The target directory for distributions
    required: false
    default: dist
  verify-metadata:
    description: Check metadata before uploading
    required: false
    default: "true"
  skip-existing:
    description: Do not fail when a distribution already exists
    required: false
    default: "false"
  verbose:
    description: Show verbose output
    required: false
    default: "true"
  print-hash:
    description: Show hash values of files to be uploaded
    required: false
    default: "true"
  attestations:
    description: Generate and upload PEP 740 attestations
    required: false
    default: "true"

runs:
  using: docker
  image: >-
    docker://ghcr.io/pypa/gh-action-pypi-publish@sha256:a68d05519f6d7e47372aeaddab80b851b69afa89be179ec41775c72c4e3ab2d5
