name: Answer-quality gate

# Answer-quality regression tripwire (closes SECURITY_RESIDUALS §6). The unit
# suite proves the guardrails are correct; it does NOT score AI-output quality.
# This gate runs the benchmark (`olympus eval`) and fails if any specialist
# regresses more than the tolerance below the committed baseline
# (olympus/quality_baseline.json).
#
# Needs an ANTHROPIC_API_KEY repo secret (the eval makes real calls). Spend is
# capped via OLYMPUS_DAILY_BUDGET. If the secret isn't set, the gate skips
# cleanly (exit 0) rather than failing — CI without the secret is not a failure.
#
# To (re)establish the baseline after an intended quality change: a maintainer
# runs `python scripts/quality_gate.py --update-baseline` with a key and commits
# the refreshed olympus/quality_baseline.json.

on:
  schedule:
    - cron: "0 7 * * 1"        # weekly, Monday 07:00 UTC
  workflow_dispatch:           # and on demand
  pull_request:
    paths:                     # only when something that can move quality changes
      - "olympus/prompts/**"
      - "olympus/skills/**"
      - "olympus/benchmarks.json"
      - "olympus/quality_baseline.json"
      - "olympus/evals.py"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps
      - name: Run the answer-quality gate (skips if no key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OLYMPUS_DAILY_BUDGET: "5.00"     # hard cap on spend for this run
        # Olympus never assumes a model (require_model raises without one), so
        # CI pins provider + model explicitly, keyed on which secret exists:
        # an Anthropic key wins; otherwise a Kimi (Moonshot) key runs through
        # the OpenAI-compatible provider. Models are pinned to CONCRETE
        # versions — a floating alias would silently shift the baseline.
        # With neither secret, the gate script skips cleanly (exit 0).
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            export OLYMPUS_PROVIDER="anthropic"
            export OLYMPUS_MODEL="claude-opus-4-8"
          elif [ -n "$KIMI_API_KEY" ]; then
            export OLYMPUS_PROVIDER="openai"
            export OPENAI_API_KEY="$KIMI_API_KEY"
            export OLYMPUS_BASE_URL="https://api.moonshot.ai/v1"
            # Model availability differs per Moonshot account/tier, so resolve
            # against the account's own /v1/models inventory: first match from
            # the preference list wins (newest capable first), else the first
            # kimi-* id, else the first id. The inventory and the choice are
            # logged so the baseline records exactly what scored it.
            ids=$(curl -sf https://api.moonshot.ai/v1/models \
                    -H "Authorization: Bearer $KIMI_API_KEY" \
                  | python3 -c "import json,sys; print('\n'.join(m['id'] for m in json.load(sys.stdin).get('data',[])))")
            echo "Available Moonshot models:"; echo "$ids" | sed 's/^/  /'
            for cand in kimi-k2-0905-preview kimi-k2-0711-preview \
                        kimi-k2-turbo-preview kimi-latest \
                        moonshot-v1-32k moonshot-v1-8k; do
              if echo "$ids" | grep -qx "$cand"; then
                export OLYMPUS_MODEL="$cand"; break
              fi
            done
            if [ -z "${OLYMPUS_MODEL:-}" ]; then
              export OLYMPUS_MODEL=$(echo "$ids" | grep -m1 '^kimi' || echo "$ids" | head -1)
            fi
            echo "Using eval model: $OLYMPUS_MODEL"
          fi
          python scripts/quality_gate.py
