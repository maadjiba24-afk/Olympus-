name: Quality authorization and comparison contracts

# Automatic CI proves owned/mock contracts, never measured model quality.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: |
          pip freeze > /tmp/olympus-quality-runtime.txt
          pip install -e '.[test]' -c /tmp/olympus-quality-runtime.txt
      - name: Verify owned authorization and comparison fixtures
        run: python -m pytest -q tests/test_quality_gate.py tests/test_live_quality_authorization.py
