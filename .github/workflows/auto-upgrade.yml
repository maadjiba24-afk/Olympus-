# Auto-implements upgrade proposals: when an "[Olympus upgrade]" issue is opened
# BY A TRUSTED AUTHOR, a coding agent implements it on a branch and opens a PR
# for review.
#
# Security: this feeds the issue title/body straight into a coding agent that
# holds contents/pull-requests write. Anyone can open an issue, so the job is
# gated on author_association — only the repo owner, org members, and
# collaborators can trigger it. Without that gate, an attacker-controlled issue
# body is a prompt-injection path to branch/PR write and API-budget burn.
#
# Setup (one time): add ANTHROPIC_API_KEY to the repo's Actions secrets. This
# workflow runs only on "[Olympus upgrade]" issues from trusted authors and
# never on push/PR, so it cannot block CI. (Without the secret the
# claude-code-action step fails, but that failure is confined to this workflow.)

name: Auto-Upgrade

on:
  issues:
    types: [opened]

jobs:
  implement:
    if: >
      startsWith(github.event.issue.title, '[Olympus upgrade]') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Implement the improvement described in issue #${{ github.event.issue.number }}:

            ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Work on a new branch, follow the existing code style, add or
            update tests in tests/, make sure `pytest -q` passes, then open
            a pull request that references the issue.
