# Auto-implements upgrade proposals: when an "[Olympus upgrade]" issue is
# opened, a coding agent implements it on a branch and opens a PR for review.
#
# Setup (one time): add ANTHROPIC_API_KEY to the repo's Actions secrets.
# Without the secret this workflow simply no-ops — it never blocks CI.

name: Auto-Upgrade

on:
  issues:
    types: [opened]

jobs:
  implement:
    if: startsWith(github.event.issue.title, '[Olympus upgrade]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Implement the improvement described in issue #${{ github.event.issue.number }}:

            ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Work on a new branch, follow the existing code style, add or
            update tests in tests/, make sure `pytest -q` passes, then open
            a pull request that references the issue.
