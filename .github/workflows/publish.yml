name: Publish to PyPI

# Publishes the package when you push a version tag (e.g. v0.16.0).
# One-time setup on PyPI: create the project, then add a "Trusted Publisher"
# for this repo + workflow (no API token needed). See
# https://docs.pypi.org/trusted-publishers/ . Alternatively, set a
# PYPI_API_TOKEN secret and switch the publish step to use it.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sign the release (witness manifest)
        # Generate the signed verification.json so it ships inside the wheel.
        # Set OLYMPUS_SIGNING_SEED as a repo secret for an authentic key.
        env:
          OLYMPUS_SIGNING_SEED: ${{ secrets.OLYMPUS_SIGNING_SEED }}
        run: |
          python -m pip install -e .
          python -m olympus sign
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the built distributions
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
