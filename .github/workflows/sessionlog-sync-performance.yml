name: Sessionlog sync performance telemetry

# Absolute `sessionlog.sync` latency — the LIVE per-turn journal path.
#
# WHY THIS IS NOT PART OF CI. The p50/p99 bounds this job enforces used to live
# in the required pytest suite. On uncontrolled GitHub-hosted runners that gate
# cannot tell an Olympus regression from host load, and on 2026-08-09 run
# 31377790256 it failed the Windows Python 3.12 leg (p99 284.429 ms against a
# 250 ms bound) on a commit whose failing test function and benchmark are
# byte-identical to its base, whose diff touched no file under olympus/, and
# whose local Windows full suite passed. Linux 3.10-3.13 passed the same commit.
# The measured series decayed (first decile 74.406 ms, last decile 9.273 ms)
# where the cached path should be roughly flat in depth. That is consistent
# with uncontrolled runner variance or an early-run transient; the precise
# external cause was NOT proven and this workflow does not claim one.
#
# The thresholds are NOT relaxed here: scripts/sessionlog_sync_telemetry.py
# enforces turns=60, cache=True, p50 < 60 ms and p99 < 250 ms — exactly the
# numbers the required test used. What changed is only what a breach blocks.
# This job goes red on a breach and that red is real evidence; it simply does
# not hold an unrelated pull request shut.
#
# A SECOND relocated contract runs here too: the D1 depth-scaling A/B, at
# depths=(100, 900) and samples=12, with its original strict bounds —
# uncached slope > 5.0 us/turn, cached slope < uncached/5.0, and paired
# speedup at the maximum depth > 2.0. It was left in required pytest by the
# first pass of this correction and duly failed push run 31427036314 on the
# Windows 3.12 leg (reduction 1.935x, paired speedup 1.638x) on a branch that
# changed no production code. Both contracts are measured once per leg, in
# separate protected steps, so a breach in one still yields the other's
# evidence.
#
# `sessionlog.sync` IS production (orchestrator -> memory.save_conversation ->
# sync), so moving a timing bound is only defensible because the deterministic
# integrity contract that replaced it in the required suite is strictly
# stronger — routing, one record per extending turn, dense sequences, verified
# chain, replayed-history equality, and exact scan/fsync/byte accounting.
#
# It is deliberately absent from the required `CI / test` aggregate context and
# runs on schedule and on demand only — never on push or pull_request. The
# matrix covers exactly the platforms that previously enforced this contract in
# the required suite, so relocating it loses no coverage.

on:
  schedule:
    - cron: "0 10 * * 1"       # weekly, Monday 10:00 UTC
  workflow_dispatch:           # and on demand

# 06:00 replay-gate, 07:00 quality-gate, 08:00 sessionlog append telemetry,
# 09:00 usage-contention telemetry, 10:00 here — no slot is shared.

jobs:
  sessionlog-sync-latency:
    strategy:
      fail-fast: false         # one red leg must not hide another leg's result
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps

      # TWO relocated contracts, each measured EXACTLY ONCE per matrix leg. No
      # retry, no resampling, no sample selection, and no `continue-on-error`:
      # a non-zero exit from either step fails this job.
      - name: Measure sessionlog.sync latency
        run: >
          python scripts/sessionlog_sync_telemetry.py
          --measure latency
          --out sessionlog-sync-latency.json

      # `if: always()` so a latency breach cannot suppress the depth-scaling
      # evidence. It does NOT soften the verdict — the job is already red from
      # the step above, and this step's own exit code is honoured too.
      - name: Measure sessionlog.sync depth scaling
        if: always()
        run: >
          python scripts/sessionlog_sync_telemetry.py
          --measure depth
          --out sessionlog-sync-depth.json

      # Uploaded even when a measurement failed, because a red run is exactly
      # when the numbers are worth reading. Each name carries both the contract
      # and the matrix leg, so ten uploads cannot collide.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sessionlog-sync-latency-${{ matrix.os }}-py${{ matrix.python-version }}
          path: sessionlog-sync-latency.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sessionlog-sync-depth-${{ matrix.os }}-py${{ matrix.python-version }}
          path: sessionlog-sync-depth.json
