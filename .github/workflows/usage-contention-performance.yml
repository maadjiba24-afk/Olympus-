name: Usage contention performance telemetry

# Absolute usage-ledger contention latency, measured on every platform that
# previously enforced this contract.
#
# WHY THIS IS NOT PART OF CI. These bounds used to live in the required pytest
# suite. On the v0.27.3 release branch that gate failed the Linux Python 3.11
# leg: four of five repetitions carried p99 outliers of 865-1188 ms against the
# unchanged 500 ms bound, while every deterministic guarantee held — exact
# persisted accounting, every sample collected, every worker started, the
# barrier tripped, p50 healthy, throughput above 100 calls/s. The release diff
# touched only version metadata and CHANGELOG.md, and the other Linux versions
# and Windows passed at the same commit. That evidence is consistent with
# uncontrolled hosted-runner contention, but the precise external cause was not
# proven and this file does not claim it was.
#
# The thresholds are NOT relaxed here: scripts/usage_contention_telemetry.py
# enforces exactly the numbers the required test used, including the 3-of-5
# quorum. What changed is only what a breach blocks. This job goes red on a
# breach and that red is real evidence; it simply does not hold an unrelated
# pull request shut.
#
# It is deliberately absent from ci.yml and from the required `CI / test`
# aggregate context, and it runs on schedule and on demand only — never on push
# or pull_request. The schedule is Monday 09:00 UTC so it does not overlap the
# Monday 08:00 UTC sessionlog latency telemetry.

on:
  schedule:
    - cron: "0 9 * * 1"        # weekly, Monday 09:00 UTC
  workflow_dispatch:           # and on demand

jobs:
  usage-contention:
    # Every platform/interpreter combination that previously enforced this
    # contract in the required suite, so relocating it loses no coverage.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps

      # Exactly one execution per matrix job. No retry, no resampling, no
      # repetition selection, and no `continue-on-error`: a non-zero exit fails
      # this job.
      - name: Measure usage-ledger contention latency
        run: >
          python scripts/usage_contention_telemetry.py
          --out usage-contention-telemetry.json

      # Uploaded even when the step above failed, because a red run is exactly
      # when the numbers are worth reading. The name carries the matrix leg so
      # the five jobs cannot collide on one artifact.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: usage-contention-telemetry-${{ matrix.os }}-py${{ matrix.python-version }}
          path: usage-contention-telemetry.json
