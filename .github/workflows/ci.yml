name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q olympus
      # Fail the build if any published capability count (agents/tools/commands)
      # drifts from the code or the committed manifest. See olympus/capabilities.py.
      - run: python -m olympus capabilities --check
      - run: pytest -q
