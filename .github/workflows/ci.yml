name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others — we want the full
      # compatibility picture across the supported range on every run.
      fail-fast: false
      matrix:
        # The full range pyproject declares (requires-python >=3.10, classifiers
        # 3.10–3.13). tests/test_ci_matrix.py fails if this drifts from pyproject.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install the exact, hash-pinned dependency set (supply-chain integrity).
      # requirements.lock is a UNIVERSAL hash lock — `uv pip compile
      # --generate-hashes` records every distribution's hash (all platform/ABI
      # wheels + sdist), so `--require-hashes` is satisfied on each matrix Python
      # from the SAME lock; no per-version lock files, no unpinned installs.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps
      # The `test` extra is CI-only TEST tooling (not shipped dependencies) —
      # the single source of truth lives in pyproject `[project.optional-
      # dependencies].test`. Without it these tests self-skip, leaving coverage
      # dark:
      #   * openai — the client tests/test_openai_endpoint.py uses to drive the
      #     OpenAI-compatible server.
      #   * pyyaml — required by the ABC drift guard (tests/test_abc.py,
      #     test_abc_surface.py) that pins behavioral_contracts.yaml against the
      #     embedded _DEFAULT_CONTRACTS mirror; without it a drift between the
      #     human-readable YAML and the authoritative embedded dict ships
      #     uncaught.
      #   * mcp — the native MCP client integration (tests/test_mcp_integration.py).
      #   * websockets — the CDP transport, exercised by the browser-smoke job.
      # (Same de-darking pattern as build/twine/cyclonedx/playwright.)
      - run: pip install -e '.[test]'
      # Refuse pre-release (alpha/beta/rc/dev) dependencies.
      - run: python scripts/check_no_prerelease.py requirements.lock
      - run: python -m compileall -q olympus
      # Fail the build if any published capability count drifts from the code.
      - run: python -m olympus capabilities --check
      # Fail if any exposed tool is missing from the threat model.
      - run: python scripts/check_threat_model.py
      - run: pytest -q

  noninterference:
    # Observability non-interference gate (Wave 1 C3). Keyless, no secrets, no
    # network: it imports the committed replay fixture into a throwaway store and
    # re-runs the recorded pipeline twice — instrumentation OFF vs ON (stub OTLP
    # poster, metrics recording, a hostile observe-only plugin) — failing the
    # build if any decision or reply hash differs. Proves I-N1/I-N2 per PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: python scripts/noninterference_gate.py

  # Aggregate gate that reports a single status context named `test`.
  # The real work above runs as a per-version MATRIX, so it reports
  # `test (py3.10)` … `test (py3.13)` — there is no longer a plain `test`
  # context. A branch-protection rule that requires a check literally named
  # `test` would therefore wait forever for a status no job produces, blocking
  # every merge. This job restores that context: it needs the whole matrix and
  # fails if any leg failed or was cancelled, so requiring `test` keeps
  # enforcing the full matrix without pinning each version name in settings.
  # The keyless non-interference gate is folded into the same required context so
  # branch protection enforces it too without a second settings pin.
  test-gate:
    name: test
    needs: [test, noninterference]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every test matrix leg to pass
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ]; then
            echo "::error::test matrix did not pass (result: $result)"
            exit 1
          fi
          echo "All test (py3.x) matrix legs passed."
      - name: Require the non-interference gate to pass
        run: |
          result="${{ needs.noninterference.result }}"
          if [ "$result" != "success" ]; then
            echo "::error::non-interference gate did not pass (result: $result)"
            exit 1
          fi
          echo "Non-interference gate passed."

  package:
    # Build the wheel/sdist and validate their metadata the same way the
    # publish workflow does, so a packaging regression (bad license metadata,
    # missing data files, …) is caught on every PR — not at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cyclonedx-bom
      # CycloneDX Software Bill of Materials, generated from the pinned lock.
      - run: cyclonedx-py requirements requirements.lock --of JSON -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json

  browser-smoke:
    # The default `test` job runs browserless, so the real-Chromium smoke tests
    # (tests/test_browser_real.py + tests/test_browser_smoke.py) self-skip there.
    # This job provisions a real Chromium (Playwright) plus the optional
    # `websockets` CDP transport and sets the opt-in flags, so the live browser
    # path is actually exercised end-to-end on every push/PR instead of being
    # perpetually skipped. It never gates behind a missing browser here — the
    # binary is installed in this step, so a launch/transport regression fails
    # the build rather than silently skipping.
    runs-on: ubuntu-latest
    env:
      # _find_chrome() globs chromium-*/chrome-linux/chrome under this path.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same hash-pinned runtime as `test`; the browser tooling below is CI-only
      # (like build/twine/cyclonedx in the other jobs), not a shipped dependency.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps
      - run: pip install pytest websockets playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run the real-browser smoke tests
        env:
          OLYMPUS_BROWSER_REAL: "1"
          OLYMPUS_BROWSER_SMOKE: "1"
        run: pytest -q tests/test_browser_real.py tests/test_browser_smoke.py

  playwright-browser-e2e:
    # Launch Firefox and WebKit as real browser processes and exercise Olympus
    # navigation, interaction, keyboard input, screenshots, uploads, downloads,
    # dialogs, console events, network-idle tracking, and tab switching.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - firefox
          - webkit
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps
      - run: pip install pytest playwright
      - name: Install real ${{ matrix.browser }} browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run Olympus end-to-end tests in ${{ matrix.browser }}
        env:
          OLYMPUS_BROWSER_PLAYWRIGHT_REAL: "1"
          OLYMPUS_BROWSER_ENGINE: ${{ matrix.browser }}
        run: python -m pytest -q tests/test_browser_playwright_real.py

  search-live:
    # Exercise Olympus against real external search services. This job always
    # launches a pinned, local SearXNG instance and also tests keyless DDG.
    # Credentialed providers run when their repository secrets are available.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps
      - run: pip install pytest

      - name: Start pinned local SearXNG
        run: |
          docker run --detach \
            --name olympus-searxng \
            --publish 127.0.0.1:8888:8080 \
            --env FORCE_OWNERSHIP=false \
            --volume "$PWD/.github/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            searxng/searxng:2026.7.26-b060c780d

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --get \
              --data-urlencode "q=Olympus agent framework GitHub" \
              --data "format=json" \
              --output /tmp/searxng-ready.json \
              http://127.0.0.1:8888/search \
              && python -c "import json; data=json.load(open('/tmp/searxng-ready.json', encoding='utf-8')); raise SystemExit(0 if data.get('results') else 1)"
            then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::SearXNG JSON search API did not become operational"
            docker logs olympus-searxng
            exit 1
          fi

      - name: Run real search-provider end-to-end tests
        env:
          OLYMPUS_SEARCH_LIVE: "1"
          OLYMPUS_SEARXNG_URL: http://127.0.0.1:8888
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_PSE_KEY: ${{ secrets.GOOGLE_PSE_KEY }}
          GOOGLE_PSE_CX: ${{ secrets.GOOGLE_PSE_CX }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python -m pytest -q tests/test_websearch_live.py

      - name: Stop local SearXNG
        if: always()
        run: docker rm --force olympus-searxng || true

  docker-sandbox:
    # The default `test` job has no Docker daemon, so the sandbox-hardening
    # integration tests (tests/test_sandbox_docker_integration.py) self-skip
    # there — they only unit-check the argv, never that the flags change
    # container behaviour at runtime. GitHub-hosted ubuntu runners ship a
    # running Docker engine with unrestricted registry access, so this job
    # actually exercises the docker backend end-to-end (cap-drop ALL,
    # no-new-privileges, --network none) on every push/PR. A regression that
    # weakens the sandbox fails the build here instead of skipping silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps
      - run: pip install pytest
      # Prove the daemon is up and can fetch the base image the probe uses.
      - run: docker info >/dev/null && docker pull python:3.11-slim
      - name: Run the docker sandbox-hardening integration tests
        run: pytest -q tests/test_sandbox_docker_integration.py
