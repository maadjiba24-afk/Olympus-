name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the exact, hash-pinned dependency set (supply-chain integrity).
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps
      - run: pip install pytest
      # Refuse pre-release (alpha/beta/rc/dev) dependencies.
      - run: python scripts/check_no_prerelease.py requirements.lock
      - run: python -m compileall -q olympus
      # Fail the build if any published capability count drifts from the code.
      - run: python -m olympus capabilities --check
      # Fail if any exposed tool is missing from the threat model.
      - run: python scripts/check_threat_model.py
      - run: pytest -q

  package:
    # Build the wheel/sdist and validate their metadata the same way the
    # publish workflow does, so a packaging regression (bad license metadata,
    # missing data files, …) is caught on every PR — not at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cyclonedx-bom
      # CycloneDX Software Bill of Materials, generated from the pinned lock.
      - run: cyclonedx-py requirements requirements.lock --of JSON -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json

  browser-smoke:
    # The default `test` job runs browserless, so the real-Chromium smoke tests
    # (tests/test_browser_real.py + tests/test_browser_smoke.py) self-skip there.
    # This job provisions a real Chromium (Playwright) plus the optional
    # `websockets` CDP transport and sets the opt-in flags, so the live browser
    # path is actually exercised end-to-end on every push/PR instead of being
    # perpetually skipped. It never gates behind a missing browser here — the
    # binary is installed in this step, so a launch/transport regression fails
    # the build rather than silently skipping.
    runs-on: ubuntu-latest
    env:
      # _find_chrome() globs chromium-*/chrome-linux/chrome under this path.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same hash-pinned runtime as `test`; the browser tooling below is CI-only
      # (like build/twine/cyclonedx in the other jobs), not a shipped dependency.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e . --no-deps
      - run: pip install pytest websockets playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run the real-browser smoke tests
        env:
          OLYMPUS_BROWSER_REAL: "1"
          OLYMPUS_BROWSER_SMOKE: "1"
        run: pytest -q tests/test_browser_real.py tests/test_browser_smoke.py
